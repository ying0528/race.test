<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F7F5F2">
<title>打造我的家｜手機編輯器</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-touch-callout: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; height: 100%; overflow: hidden; position: fixed; inset: 0; width: 100%; background: #F7F5F2; color: #1D2129; overscroll-behavior: none;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  button { font-family: inherit; color: inherit; }
  .hidden { display: none !important; }
  #app { display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; font-size: 12px; color: #5F6672; }
  #status { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: #ECE8E2; font-weight: 700; }
  #status i { width: 8px; height: 8px; border-radius: 8px; background: #9AA0A8; }
  #status[data-s="ok"] { background: #E5F2EA; color: #1F6B45; } #status[data-s="ok"] i { background: #2E9E5E; }
  #status[data-s="bad"] { background: #FBE9E7; color: #B3261E; } #status[data-s="bad"] i { background: #B3261E; }
  main { flex: 1; min-height: 0; overflow: hidden; padding: 2px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  main > * { flex-shrink: 0; }
  h2 { margin: 0; font-size: 22px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .muted { color: #5F6672; font-size: 13px; }
  nav { display: flex; border-top: 1px solid #E4E1DC; background: #fff; padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; height: 58px; border: none; background: none; font-size: 15px; font-weight: 700; color: #5F6672; }
  nav button.on { color: #A0673A; box-shadow: inset 0 3px 0 #A0673A; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .card { padding: 14px; border-radius: 16px; background: #fff; border: 2px solid #E4E1DC; text-align: left; display: flex; flex-direction: column; gap: 6px; }
  .card.on { border-color: #A0673A; background: #FBF6F1; }
  .card b { font-size: 17px; } .sw { display: flex; gap: 5px; } .sw i { width: 24px; height: 24px; border-radius: 6px; border: 1px solid rgba(0,0,0,.08); }
  .styles .card { padding: 10px 12px; flex-direction: row; align-items: center; gap: 10px; } .styles .sw i { width: 18px; height: 18px; }
  .second.on { border-color: #A0673A; background: #FBF6F1; color: #A0673A; }
  main > .chips { margin: 0 -14px; padding: 0 14px; }
  .fgrid { flex: 1 1 0; min-height: 0; overflow-y: auto; touch-action: pan-y; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; align-content: start; }
  .fsw { padding: 5px 5px 6px; border-radius: 12px; border: 2px solid #E4E1DC; background: #fff; display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
  .fsw.on { border-color: #A0673A; background: #FBF6F1; }
  .fsw span { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fsw i { display: block; aspect-ratio: 1.25; border-radius: 7px; background-color: var(--c); border: 1px solid rgba(0,0,0,.1); }
  .fk-wood { background-image: linear-gradient(90deg, transparent 49%, rgba(0,0,0,.16) 49% 51%, transparent 51%), repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 1px, transparent 1px 11px), repeating-linear-gradient(0deg, rgba(255,255,255,.1) 0 11px, rgba(0,0,0,.07) 11px 22px); }
  .fk-terrazzo { background-image: radial-gradient(rgba(60,50,40,.5) 1.4px, transparent 1.8px), radial-gradient(rgba(255,255,255,.75) 1.6px, transparent 2px), radial-gradient(rgba(190,140,80,.5) 1.2px, transparent 1.6px); background-size: 13px 13px, 17px 17px, 11px 11px; background-position: 2px 3px, 8px 9px, 5px 1px; }
  .fk-tile { background-image: linear-gradient(rgba(0,0,0,.2) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.2) 1px, transparent 1px); background-size: 50% 50%; }
  .fk-stone { background-image: linear-gradient(rgba(0,0,0,.22) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.22) 1px, transparent 1px), radial-gradient(rgba(255,255,255,.14) 30%, transparent 70%); background-size: 25% 33.4%, 25% 33.4%, 60% 80%; }
  .fk-carpet { background-image: radial-gradient(rgba(255,255,255,.22) 1px, transparent 1.4px); background-size: 4px 4px; }
  .primary.alt { background: #3C4047; }
  .primary { height: 50px; border: none; border-radius: 14px; background: #A0673A; color: #fff; font-size: 16px; font-weight: 900; }
  .second { height: 44px; border: 1px solid #D9D5CE; border-radius: 12px; background: #fff; font-size: 14px; font-weight: 700; }
  .second:disabled { opacity: .4; }
  .rowb { display: flex; gap: 8px; } .rowb > * { flex: 1; }
  .planBox { flex: 1 1 0; min-height: 0; background: #fff; border-radius: 16px; border: 1px solid #E4E1DC; padding: 6px; touch-action: none; }
  .plan { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  #sel { height: 42px; padding: 0 12px; border-radius: 12px; background: #fff; border: 1px solid #E4E1DC; font-size: 13px; display: flex; align-items: center; gap: 10px; overflow: hidden; }
  #sel b { font-size: 14px; flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sel span { flex: 0 0 auto; color: #5F6672; white-space: nowrap; font-size: 12px; }
  /* 型錄 */
  #sheet { position: fixed; inset: 0; background: #F7F5F2; display: flex; flex-direction: column; z-index: 5; }
  #sheet .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px 6px; }
  #sheet .top h2 { min-width: 0; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 6px 16px; scrollbar-width: none; flex-shrink: 0; }
  .chips button { flex-shrink: 0; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9D5CE; background: #fff; font-size: 14px; font-weight: 700; }
  .chips button.on { background: #A0673A; border-color: #A0673A; color: #fff; }
  #list { flex: 1; overflow-y: auto; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 8px; }
  .it { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; background: #fff; border: 1px solid #E4E1DC; text-align: left; width: 100%; }
  .it .pv { width: 84px; height: 84px; border-radius: 12px; background: #F1EEE9; flex-shrink: 0; position: relative; overflow: hidden; }
  .it .pv svg { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); }
  .it .pv img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; }
  .it .pv img.ok { opacity: 1; background: #F1EEE9; }
  .it .tx { min-width: 0; flex: 1; }
  .it:disabled { opacity: .4; }
  .it .nm { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; } .it .dm { font-size: 12px; color: #5F6672; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .it .add { margin-left: auto; padding: 8px 14px; border-radius: 999px; background: #F6EDE4; color: #A0673A; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  /* 3D 導覽：上半轉頭、下半走動，各佔一半 */
  .zone { flex: 1 1 0; min-height: 0; position: relative; border-radius: 18px; border: 2px solid #D9D5CE; background: #fff; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; overflow: hidden; }
  .zone b { font-size: 18px; pointer-events: none; } .zone span { font-size: 13px; color: #5F6672; pointer-events: none; }
  .zone.look { background: #F0F1F3; } .zone.look.on { border-color: #3C4047; background: #E4E6EA; }
  .zone.move { background: #FBF6F1; border-color: #E6D5C4; }
  .stick { position: absolute; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; border: 2px solid #A0673A; background: rgba(160,103,58,.08); pointer-events: none; }
  .stick i { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: #A0673A; box-shadow: 0 6px 14px rgba(160,103,58,.35); }
</style>
</head>
<body>
<div id="app">
  <header><div id="status"><i></i><span id="statusText">正在連線…</span></div><div id="unitName"></div></header>
  <main id="main"></main>
  <nav id="nav">
    <button data-tab="style">風格</button><button data-tab="edit">佈置</button><button data-tab="tour">3D 導覽</button>
  </nav>
</div>
<div id="sheet" class="hidden">
  <div class="top"><h2 id="sheetTitle">新增家具</h2><button class="second" id="sheetClose" style="height:40px;padding:0 16px;flex-shrink:0">關閉</button></div>
  <div class="chips" id="groups"></div>
  <div class="chips" id="cats"></div>
  <div id="list"></div>
</div>
<script type="module" src="./js/phone.js?v=20261112g"></script>
</body>
</html>
