<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打造我的家｜新板東京 A1</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #E9ECEF; color: #1D2129;
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: rgba(238, 240, 242, 0.80); backdrop-filter: blur(6px); text-align: center; padding: 24px; }
  .brand { font-size: 15px; letter-spacing: 6px; color: #A0673A; font-weight: 700; }
  h1 { margin: 0; font-size: clamp(44px, 7vw, 92px); font-weight: 900; letter-spacing: 4px; }
  .sub { font-size: clamp(16px, 1.6vw, 22px); color: #4E5561; max-width: 720px; line-height: 1.7; }
  .btn { height: 68px; padding: 0 56px; border: none; border-radius: 999px; background: #A0673A; color: #fff; font-size: 24px; font-weight: 900;
    font-family: inherit; cursor: pointer; box-shadow: 0 12px 30px rgba(160, 103, 58, 0.35); }
  .btn:hover { background: #8A5630; }
  .ghost { background: none; border: none; color: #4E5561; font-family: inherit; font-size: 15px; cursor: pointer; text-decoration: underline; }
  .units { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .unit { width: 300px; padding: 22px; border-radius: 22px; background: #fff; border: 2px solid transparent; text-align: left; font-family: inherit; color: inherit;
    box-shadow: 0 10px 30px rgba(25, 30, 40, 0.12); cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
  .unit:hover { border-color: #A0673A; }
  .unit[disabled] { opacity: 0.5; cursor: not-allowed; border-color: transparent; }
  .unit b { font-size: 26px; } .unit span { color: #5F6672; font-size: 15px; }
  .unit em { font-style: normal; align-self: flex-start; margin-top: 8px; padding: 6px 14px; border-radius: 999px; background: #F6EDE4; color: #A0673A; font-weight: 700; font-size: 14px; }
  .note { font-size: 12px; color: #5F6672; }

  #hud > * { position: fixed; }
  .card { background: rgba(255, 255, 255, 0.94); border-radius: 16px; box-shadow: 0 8px 26px rgba(25, 30, 40, 0.14); }
  #title { left: 20px; top: 16px; padding: 12px 18px; display: flex; align-items: center; gap: 14px; }
  #title b { font-size: 20px; } #title span { font-size: 13px; color: #5F6672; }
  #modeChip { padding: 6px 14px; border-radius: 999px; background: #A0673A; color: #fff; font-size: 14px; font-weight: 700; }
  #panel { right: 16px; top: 16px; width: 184px; padding: 12px; display: flex; flex-direction: column; gap: 9px; }
  #qr { width: 160px; height: 160px; word-break: break-all; padding: 8px; background: #fff; border-radius: 10px; border: 1px solid #E4E1DC; display: flex; align-items: center; justify-content: center; font-size: 13px; text-align: center; }
  #qr svg { width: 100%; height: 100%; }
  #net { font-size: 12px; color: #5F6672; text-align: center; } #net[data-ok="1"] { color: #1F6B45; } #net[data-ok="0"] { color: #B3261E; }
  .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: #5F6672; }
  .row b { color: #1D2129; font-size: 15px; }
  #swatches { display: flex; gap: 6px; } #swatches i { flex: 1; height: 22px; border-radius: 7px; border: 1px solid rgba(0, 0, 0, 0.08); }
  .line { height: 1px; background: #E4E1DC; }
  #tip { left: 20px; bottom: 16px; padding: 8px 14px; font-size: 12px; color: #5F6672; }
  body[data-mode="tour"] #panel { width: auto; padding: 10px 14px; }
  body[data-mode="tour"] #panel > :not(.keep) { display: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="start" class="overlay">
  <div class="brand">DOWNTOWN RESIDENCE</div>
  <h1>打造我的家</h1>
  <div class="sub">用手機當遙控器，在大螢幕上親手佈置你的新家：<br>選風格、擺家具，最後走進去逛一圈。</div>
  <button class="btn" id="startBtn">開始遊戲</button>
  <div class="note">3D 畫面為示意，家具與裝潢非交屋附贈，實際以合約為準。</div>
</div>

<div id="select" class="overlay hidden">
  <div class="brand">選擇戶型</div>
  <div class="units">
    <button class="unit" id="unitA1"><b>新板東京 A1</b><span>3 房 2 廳 2 衛 · 11F</span><span>依實際平面圖 1:1 建模</span><em>進入佈置</em></button>
    <button class="unit" disabled><b>其他戶型</b><span>即將開放</span><span>&nbsp;</span><em>敬請期待</em></button>
  </div>
  <button class="ghost" id="backBtn">回到開始頁</button>
</div>

<div id="hud" class="hidden">
  <div id="title" class="card"><div><b>新板東京 A1</b><br><span>3 房 2 廳 2 衛 · 11F</span></div><div id="modeChip">全戶鳥瞰</div></div>
  <div id="panel" class="card">
    <div id="qr">產生中…</div>
    <div style="font-size:14px;font-weight:700;text-align:center">手機掃碼加入</div>
    <div id="net">準備中…</div>
    <div class="line"></div>
    <div class="row keep"><span>已連線手機</span><b><span id="count">0</span> 支</b></div>
    <div class="row"><span>風格</span><b id="styleName"></b></div>
    <div id="swatches"></div>
  </div>
  <div id="tip" class="card">3D 畫面為示意，家具與裝潢非交屋附贈，實際以合約為準。</div>
</div>

<script type="module" src="./js/host.js"></script>
</body>
</html>
